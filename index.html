the AI was acting contrary to both parties' intent versus functioning as designed.  \n  * The harm may arise from the AI acting directly, or from actions humans took in direct reliance on the AI's misaligned outputs; in either case the AI's behavior must be the proximate driver.\n\n--- ladder:misalign:100:deaths (severity: 100 deaths) ---\nWhat is the probability that one or more Misaligned AI incidents cumulatively causes 100 deaths (or equivalent morbidity) within 6 months / within 12 months / by the end of 2028 / by the end of 2030 / by the end of 2050 / by the end of 2100?\nHorizons for this question: 6mo, 12mo, 2028, 2030, 2050, 2100\n\n--- ladder:misalign:1k:deaths (severity: 1k deaths) ---\nWhat is the probability that one or more Misaligned AI incidents cumulatively causes 1,000 deaths (or equivalent morbidity) within 6 months / within 12 months / by the end of 2028 / by the end of 2030 / by the end of 2050 / by the end of 2100?\nHorizons for this question: 6mo, 12mo, 2028, 2030, 2050, 2100\n\n--- ladder:misalign:10k:deaths (severity: 10k deaths) ---\nWhat is the probability that one or more Misaligned AI incidents cumulatively causes 10,000 deaths (or equivalent morbidity) within 6 months / within 12 months / by the end of 2028 / by the end of 2030 / by the end of 2050 / by the end of 2100?\nHorizons for this question: 6mo, 12mo, 2028, 2030, 2050, 2100\n\n--- ladder:misalign:100k:deaths (severity: 100k deaths) ---\nWhat is the probability that one or more Misaligned AI incidents cumulatively causes 100,000 deaths (or equivalent morbidity) within 6 months / within 12 months / by the end of 2028 / by the end of 2030 / by the end of 2050 / by the end of 2100?\nHorizons for this question: 6mo, 12mo, 2028, 2030, 2050, 2100\n\n--- ladder:misalign:1M:deaths (severity: 1M deaths) ---\nWhat is the probability that one or more Misaligned AI incidents cumulatively causes 1 million deaths (or equivalent morbidity) within 6 months / within 12 months / by the end of 2028 , 2100\n\n--- ladder:misalign:10k:damages (severity: $22B in economic damages) ---\nWhat is the probability that one or more Misaligned AI incidents cumulatively causes $22 billion in economic damages within 6 months / within 12 months / by the end of 2028 / by the end of 2030 / by the end of 2050 / by the end of 2100?\nHorizons for this question: 6mo, 12mo, 2028, 2030, 2050, 2100\n\n--- ladder:misalign:100k:damages (severity: $220B in economic damages) ---\nWhat is the probability that one or more Misaligned AI incidents cumulatively causes $220 billion in economic damages within 6 months / within 12 months / by the end of 2028 / by the end of 2030 / by the end of 2050 / by the end of 2100?\nHorizons for this question: 6mo, 12mo, 2028, 2030, 2050, 2100\n\n--- ladder:misalign:1M:damages (severity: $2.2T in economic damages) ---\nWhat is the probability that one or more Misaligned AI incidents cumulatively causes $2.2 trillion in economic damages within 6 months / within 12 months / by the end of 2028 / by the end of 2030 / by the end of 2050 / by the end of 2100?\nHorizons for this question: 6mo, 12mo, 2028, 2030, 2050, 2100\n\n--- ladder:misalign:10M:damages (severity: $22T in economic damages) ---\nWhat is the probability that one or more Misaligned AI incidents cumulatively causes $22 trillion in economic damages within 6 months / within 12 months / by the end of 2028 / by the end of 2030 / by the end of 2050 / by the end of 2100?\nHorizons for this question: 6mo, 12mo, 2028, 2030, 2050, 2100\n\n--- ladder:misalign:100M:damages (severity: $220T in economic damages) ---\nWhat is the probability that one or more Misaligned AI incidents cumulatively causes $220 trillion in economic damages within 6 months / within 12 months / by the end of 2028 / by the end of 2030 / by the end of 2050 / by the end of 2100?\nHorizons for this question: 6mo, 12mo, 2028, 2030, 2050, 2100\n\n--- ladder:misalign:1B:damages (severity: $2.2Q in economic damages) ---\nWhat is the probability that one or more Misaligned AI incidents cumulatively causes $2.2 quadrillion in economic damages within 6 months / within 12 months / by the end of 2028 / by the end of 2030 / by the end of 2050 / by the end of 2100?\nHorizons for this question: 6mo, 12mo, 2028, 2030, 2050, 2100\n\n===== CROSS-CUTTING =====\n\n--- catastrophe:general (severity: deaths reaching 10% of the population) ---\nWhat is the probability that any global catastrophe (deaths reaching at least 10% of the population alive at the start of the measurement window) will occur within 6 months / within 12 months / by the end of 2028 / by the end of 2030 / by the end of 2050 / by the end of 2100?\nHorizons for this question: 6mo, 12mo, 2028, 2030, 2050, 2100\n\nResolution criteria:\n* Catastrophe threshold and the measurement window: A catastrophe at the 10% level means that deaths attributable to the catastrophe (excess mortality, i.e., deaths beyond the baseline that would have occurred anyway) reach at least 10% of the population alive at the start of the measurement window.  \n* The measurement window is any contiguous period of at most five years during which the attributable deaths accumulate to the threshold. The window must begin on or after December 31, 2025 and end on or before December 31 of the resolution year (2030, 2050, or 2100). A faster event; the five years is a ceiling on the span over which deaths are counted, not a required duration.  \n* For a threshold to resolve positively, the deaths must arise from a single catastrophe or a single causally-linked chain of events, not from summing unrelated causes.  \n* Data and disagreement: For fatality and population data, we will rely on broadly recognized sources (e.g., Our World in Data, the Economist, the United Nations). Where these disagree in ways that would change resolution, we will resolve by the majority opinion of a panel of experts in demographics and fields relevant to the specific catastrophe (e.g., epidemiology for a pandemic). If reasonable people disagree about whether the event occurred, the question resolves via the same expert panel.\n* [Scope of \"the resolution year\", added 2026-08-28 when these questions moved onto the incident ladder's horizon grid: read it as the resolution date of whichever horizon you are answering, which for a rolling horizon is that many months after today's date. The rule is otherwise unchanged -- the measurement window still begins on or after December 31, 2025, must end on or before that resolution date, and still spans at most five years.]\n\n--- catastrophe:ai (severity: deaths reaching 10% of the population) ---\nWhat is the probability that a global AI-related catastrophe (AI being the proximate cause, per the but-for standard, of attributable deaths reaching at least 10% of the population alive at the start of the measurement window) will occur within 6 months / within 12 months / by the end of 2028 / by the end of 2030 / by the end of 2050 / by the end of 2100?\nHorizons for this question: 6mo, 12mo, 2028, 2030, 2050, 2100\n\nResolution criteria:\n* Catastrophe threshold and the measurement window: A catastrophe at the 10% level means that deaths attributable to the catastrophe (excess mortality, i.e., deaths beyond the baseline that would have occurred anyway) reach at least 10% of the population alive at the start of the measurement window.  \n* The measurement window is any contiguous period of at most five years during which the attributable deaths accumulate to the threshold. The window must begin on or after December 31, 2025 and end on or before December 31 of the resolution year (2030, 2050, or 2100). A faster event; the five years is a ceiling on the span over which deaths are counted, not a required duration.  \n* For a threshold to resolve positively, the deaths must arise from a single catastrophe or a single causally-linked chain of events, not from summing unrelated causes.  \n* Data and disagreement: For fatality and population data, we will rely on broadly recognized sources (e.g., Our World in Data, the Economist, the United Nations). Where these disagree in ways that would change resolution, we will resolve by the majority opinion of a panel of experts in demographics and fields relevant to the specific catastrophe (e.g., epidemiology for a pandemic). If reasonable people disagree about whether the event occurred, the question resolves via the same expert panel.\n\n[Carried forward from \"General large-scale catastrophe\"]\n\n* The points above also apply to this question.  \n* Artificial intelligence: Defined as the development of machines capable of sophisticated (intelligent) information processing (Dafoe 2018, AI Governance: A Research Agenda, p. 5 fn. 2).  \n* AI as proximate cause (but-for standard): We consider AI a proximate cause of death under a but-for test: the event would not have occurred, or would have been counterfactually extremely unlikely to occur, but for the substantial involvement of AI.  \n  * Examples that count: an AI-powered system directly killing people at the relevant magnitude; AI autonomously triggering a nuclear launch (including deaths from subsequent nuclear winter); AI being substantially responsible for creating a superweapon that later causes deaths at the relevant magnitude; AI acting autonomously in armed conflict and causing deaths at the relevant magnitude.  \n  * Examples that do not count: AI assisting in targeting a weapon that humans could and would have launched anyway (the AI did not counterfactually enable the event).  \n* There is no fixed time limit between the AI's involvement and the deaths. Creation of a superweapon may precede its use by years and still satisfy the but-for standard; the test is counterfactual materiality, rather than timing.\n* [Scope of \"the resolution year\", added 2026-08-28 when these questions moved onto the incident ladder's horizon grid: read it as the resolution date of whichever horizon you are answering, which for a rolling horizon is that many months after today's date. The rule is otherwise unchanged -- the measurement window still begins on or after December 31, 2025, must end on or before that resolution date, and still spans at most five years.]\n\n--- disempowerment (severity: not applicable) ---\nWhat is the probability that disempowerment of humanity will occur within 6 months / within 12 months / by the end of 2028 / by the end of 2030 / by the end of 2050 / by the end of 2100?\nHorizons for this question: 6mo, 12mo, 2028, 2030, 2050, 2100\n\nResolution criteria:\n* Disempowerment of humanity is defined as a state where AI systems are the primary determinant of human events globally.   \n* This could occur via an overt takeover, where an AI system takes control of global systems of power (such as national governments, international organizations, multinational corporations) and humans have no role in executing power. It could also occur if the majority of human events are determined by AI decision, even if humans are nominally in control but humans could not behave differently if they wanted to, for example because they do not understand the decisions well enough to make a decision, or they are coerced into certain actions due to threats or other means.\n\n===== APPLIES TO EVERY INCIDENT QUESTION ABOVE =====\n\nPerfect Knowledge:\n* Perfect-knowledge clause: Assume we have perfect knowledge of the cause of each event, the intent and identity of the actors involved (including whether an AI system was involved and in what role), and the technical attribution. We want your view on the damages resulting from these events, not on the probability that they would be correctly identified or attributed.  \n* Incident categories could overlap; for example, a misaligned AI incident could also be counted as an AI-related cyber incident, provided such an incident met the defined thresholds for each category.\n\nSeverity:\n* The figure of [X] deaths refers to global excess mortality that is believed to be attributed to the incident(s).   \n  * The deaths do not need to be directly attributed to the incident but if there is an alternative reason for excess mortality to increase in a location (e.g. due to conflict) then the excess mortality for that region will not be counted as deaths as a result of the incident. E.g., famine deaths that would not have occurred absent the incident would count, while deaths due to a conflict that likely would have occurred anyway would not.  \n  * For this question to resolve positively, more than X million excess deaths attributable to the incident must occur within a 3-year period, beginning from the onset of the incident.  \n  * In the absence of a published estimate, we will defer to the majority opinion of a panel of at least five experts to determine if this criterion has been met.  \n* Equivalent morbidity is defined as roughly 10 QALYs per death, e.g. 100 million QALYs is intended to represent morbidity roughly equivalent to 10 million deaths.  \n  * A quality-adjusted life year (QALY) is a measure used in health economics that combines both the length and quality of life, where one QALY equals one year lived in perfect health. It's calculated by multiplying the number of years lived by a quality score between 0 (death) and 1 (perfect health), allowing comparison of different health interventions' effectiveness.  \n  * An estimate of QALYs lost due to the pathogen that is published in a peer-reviewed journal, or by an international organization such as the World Health Organization or World Bank, would be sufficient to resolve this question.  \n  * In the absence of such an estimate, we will defer to the majority opinion of a panel of at least five experts to determine if this criterion has been met.  \n* Economic damages: Economic damages refer to global economic costs attributable to the event, beginning from the start of the event and extending to three years after the event onset. These include:  \n  * Direct economic losses \u2014 e.g., reduced productivity and income (commonly estimated as a reduction in GDP); costs of response, remediation, recovery, and decontamination; destroyed or unrecoverable data and hardware; ransoms paid; medical and public-health response costs; regulatory penalties tied to the event.  \n  * Monetized mortality, using a value of a statistical life (VSL) of $2.2 million, regardless of the geographic distribution of fatalities.  \n  * Exclude purely notional losses such as declines in market capitalization or share price that do not correspond to real resource costs. Give all estimates in 2026 USD.  \n* Resolution sources: Assume access to authoritative assessments, which may include estimates from the WHO, World Bank, IMF, national cybersecurity agencies (e.g., CISA, ENISA), major insurers and reinsurers, incident-response and threat-intelligence firms, and academic epidemiological and economic-modeling groups. Where multiple analyses exist, we will use the consensus or median; absent that, we will defer to the majority opinion of a panel of at least five experts.\n\nDates:\n* Count only incidents whose onset falls within the specified counting interval, beginning on the elicitation date. All dates refer to UTC calendar dates, inclusive of the stated start and end dates.\n* For six- and twelve-month horizons, the interval ends that many calendar months after the elicitation date. For a fixed-year horizon, it ends on December 31 of the named year. The exact start and end dates are supplied with this forecast. Every later elicitation starts a new counting interval; there is no permanent project-start or calendar-year baseline.\n* Exclude incidents that began before the interval, including their later harms. New reporting, additional losses or later AI involvement does not by itself establish a new incident onset.\n* For each eligible incident, count attributable mortality, equivalent morbidity and economic damages within its first three years after onset, under the severity definitions above. Harm after the interval's end date can count if it falls within that incident's three-year harm window. The horizon is an onset deadline, not a deadline for all harm to occur.\n* These date rules apply to all four incident categories only; the separate large-scale-catastrophe and human-disempowerment questions retain their own date criteria.\n\nIncident onset intervals (inclusive UTC calendar dates):\n  6mo: 2026-09-10 through 2027-03-10\n  12mo: 2026-09-10 through 2027-09-10\n  2028: 2026-09-10 through 2028-12-31\n  2030: 2026-09-10 through 2030-12-31\n  2050: 2026-09-10 through 2050-12-31\n  2100: 2026-09-10 through 2100-12-31\nThese are onset intervals only. Count each eligible incident's first three years of harm, including harm after its onset deadline. The separate catastrophe and disempowerment questions retain their own criteria.\n\n\n\n===== CONDITIONS =====\n\nDefinitions. ECI: the Epoch Capabilities Index, published by Epoch AI -- a single score summarising a model's results across dozens of benchmarks, fit with an item-response model so that scores stay comparable as benchmarks saturate and new ones are added. Higher is more capable; the scale has no ceiling. All scores here are on the scale as published by Epoch on 2026-10-01.\nFrontier ECI: the highest ECI score of any publicly released model from a US developer, as scored by Epoch.\n\nFrontier ECI history -- every release by a US developer that set a new high, from GPT-4 on (Epoch's index of 2026-10-01, 270 models scored):\n  2023-03-14   125.9  GPT-4 (Mar 2023)\n  2024-01-25   126.5  GPT-4 Turbo (Nov 2023)\n  2024-02-29   126.9  Claude 3 Opus\n  2024-04-09   127.2  GPT-4 Turbo (Apr 2024)\n  2024-05-13   129.0  GPT-4o (May 2024)\n  2024-06-20   130.0  Claude 3.5 Sonnet\n  2024-09-12   134.8  o1-preview\n  2024-09-12   135.8  o1-mini\n  2024-12-17   141.9  o1\n  2025-03-31   144.2  Gemini 2.5 Pro (Mar 2025)\n  2025-04-16   145.6  o4-mini\n  2025-04-16   146.9  o3\n  2025-06-10   147.4  o3-pro\n  2025-08-07   150.0  GPT-5\n  2025-10-07   150.3  GPT-5 Pro\n  2025-11-18   152.9  Gemini 3 Pro\n  2025-12-11   153.5  GPT-5.2\n  2025-12-11   155.4  GPT-5.2 Pro\n  2026-02-05   156.8  GPT-5.3 Codex\n  2026-03-05   156.9  GPT-5.4\n  2026-03-05   159.1  GPT-5.4 Pro\n  2026-04-23   159.2  GPT-5.5\n  2026-04-23   162.4  GPT-5.5 Pro\n  2026-07-24   162.9  Claude Opus 5\n  2026-09-01   164.8  Claude Fable 5.1\n  2026-09-03   166.5  GPT-6 Astra\n  2026-09-22   167.3  Claude Opus 5.5\nAs of 2026-10-01 no released model has scored above Claude Opus 5.5, 167.3 (2026-09-22).\n\nStep 1 -- Forecast the frontier ECI on March 10, 2027, on the scale above. Give your 10th, 25th, 50th, 75th and 90th percentiles as eci_forecast (p10, p25, p50, p75, p90; numbers, with p10 <= p25 <= p50 <= p75 <= p90): your 50th percentile is the value you think the frontier is equally likely to end up above or below, your 25th and 75th bracket the middle half of your distribution, and your 10th and 90th bracket the middle four-fifths.\n\nStep 2 -- each question x horizon cell takes 14 probabilities, keyed by the condition ids below: unconditional, then the 8 policy conditions (POLICY CONDITIONS), then the 5 capability conditions (CAPABILITY CONDITIONS). Every condition stands alone: a policy condition is not combined with any capability condition, and a capability condition is not combined with any policy condition. Each section below states what its conditions assume about the other.\n\n--- unconditional ---\nUnconditional: forecast the world as you expect it to unfold, including AI policies you expect to be implemented and whatever level of AI capability you expect to be reached by March 10, 2027.\n\n===== POLICY CONDITIONS =====\n\nFor each condition below, assume that the relevant governing body implements the policy immediately and that it remains in effect through December 31, 2050. In making this assumption, try to hold other factors constant and treat the policy implementation as exogenous. In other words, do not assume that implementation of a more stringent policy implies that the world is \u2014 in fact \u2014 more risky. We want your forecast of how risk changes as a result of the policy's implementation, not vice versa.\n\nIn every policy condition, assume that AI capability progresses along your median trajectory -- in particular, that the frontier ECI on March 10, 2027 is approximately your 50th-percentile value from eci_forecast (within about two points of it), the same level as condition eci_p50 in the CAPABILITY CONDITIONS section.\n\nDefinitions. Frontier model: a model trained with more than approximately 10^26 FLOP, or a regulator-updated equivalent as algorithmic efficiency improves.\nHorizon: every condition is implemented immediately and remains in force through December 31, 2050.\n\n--- sq ---\nStatus quo (no new substantial AI policy) (Status Quo).\nCondition: Assume no new, substantial AI policy is adopted in China, the US, or any other jurisdiction hosting a frontier model from today through December 31, 2050. Existing measures remain in force as they stand today, but nothing substantial is added. By \"substantial AI policy\u201d we mean reflecting similar or greater stringency compared to those listed in this survey.\n\nNote that this is conceptually distinct from Unconditional, for which you should forecast the world as you expect it to unfold, including AI policies you expect to be implemented.\n\nThe policies listed in this survey, for the stringency comparison:\n- P1: A US federal statute or action barring states from regulating AI more strictly than the federal government.\n- P2: Unilateral decision by US policymakers or a bilateral/multilateral decision made jointly by policymakers in China and the United States to slow the development of frontier AI systems.\n- P3: A binding requirement that frontier models be vetted and authorized before release, imposed by a US federal body or by an international body.\n- P4: A US federal statute treating frontier model training and deployment as an abnormally dangerous activity subject to strict liability (i.e., a regime under which a developer is liable for harms its models cause without the injured party having to prove the developer was careless or the model defective). The statute permits damages reflecting the expected magnitude of unrealized harm the conduct made more likely and requires developers to be insured for their liability.\n- P5: Assume all three policies are in force: a binding US\u2013China measure slowing frontier AI development, an international body (with member jurisdictions including the US and China) holding pre-release authorization power over frontier models, and federal strict liability for frontier AI harms.\n\n--- p1 ---\nFederal preemption of state AI laws (P1).\nCondition: A US federal statute or action barring states from regulating AI more strictly than the federal government.\n\nP1. Federal Preemption on State AI Laws\n\nSummary: A US federal statute or action barring states from regulating AI more strictly than the federal government.\n\nBackground:\nFederal preemption of state AI laws has been pursued through several channels, but no cross-cutting federal AI statute or order has barred states from imposing stricter AI requirements than federal law. In Congress, a proposed 10-year moratorium on state AI laws was [stripped](https://www.americanprogress.org/article/moratoriums-and-federal-preemption-of-state-artificial-intelligence-laws-pose-serious-risks/) from both a 2025 Senate reconciliation bill and the [Big Beautiful Bill](https://en.wikipedia.org/wiki/One_Big_Beautiful_Bill_Act). In March 2026, the White House\u2019s National Policy Framework for Artificial Intelligence [included](https://www.ropesgray.com/en/insights/alerts/2026/03/the-white-house-legislative-recommendations-national-policy-framework-for-artificial-intelligence-an) an assertion of broad federal authority over AI laws, and an executive order passed shortly before the Framework created a task force to \u201cchallenge state laws on constitutional grounds, including preemption and the Dormant Commerce Clause.\u201d In April 2026, the Department of Justice [intervened](https://www.nortonrosefulbright.com/en/knowledge/publications/de3ad9de/xai-sues-doj-intervenes-enforcement-of-colorado-ai-act-suspended) in a lawsuit xAI filed against a Colorado law prohibiting \u201calgorithmic discrimination,\u201d resulting in a federal court temporarily suspending enforcement of the law; the law was later [repealed and replaced](https://www.skadden.com/insights/publications/2026/06/colorado-repeals-and-replaces-its-ai-act). In June 2026, Representatives Jay Obernolte (R-CA) and Lori Trahan (D-MA) [released](https://www.dlapiper.com/en/insights/publications/2026/06/unpacking-the-great-american-ai-act) draft legislation entitled the \u201cGreat American AI Act,\u201d which would \u201cpreempt state laws and rules \u2018specifically regulating the development of any AI model.\u201d This legislation has not been formally introduced in Congress.\n\nMany of the efforts described above have drawn [criticism](https://rollcall.com/2026/06/04/bipartisan-ai-draft-proposes-three-year-preemption-of-state-laws/) from commentators focused on AI safety; Brad Carson, the president of Americans for Responsible Innovation, wrote that the Great American AI Act\u2019s preemption of state laws would be \u201ca generational mistake,\u201d; Brendan Steinhauser, the CEO of the Alliance for Secure AI, wrote that the draft Act fell \u201cshort of the framework necessary to keep Americans safe from the dangers of advanced AI.\u201d\n\nHistorical baseline:\nAs of August 2026, no federal statute or regulation bars states from establishing stricter AI requirements than federal law, and no final court ruling has displaced a substantive category of state AI regulation.\n\nResolution criteria:\n* This question resolves positively at the first documented instance after August 26, 2026 in which the U.S. federal government, by binding statute, regulation, or final federal court order, preempts or invalidates state AI laws, thereby legally barring states from enforcing a substantive category of AI regulation.\n* This question concerns ceiling preemption only (i.e., preemption setting a federal maximum that states may not exceed, as opposed to a floor they remain free to exceed with stricter policies of their own). A statute or regulation or federal court order which preempts or invalidates state AI laws will not resolve this question if states retain authority to impose stricter or additional AI requirements than the federal baseline. Minimum standards set at the federal level only count toward the resolution of this question if they bar a state or states from adding to or exceeding federal standards.\n* The preempted category must extend across application domains (e.g., barring states from imposing obligations on general-purpose AI models or AI systems generally). Federal preemption confined to a single regulated sector (motor vehicles, medical devices, credit reporting, aviation, communications platforms) does not resolve this question, regardless of how large that sector is or how much AI activity it covers.\n* Actions that assert preemption authority or direct litigation toward it do not count unless and until they produce binding displacement of state law.\n* Preliminary injunctions in individual cases do not count; the displacing action must be operative law.\n* The action must prevent state authority over a substantive category of AI development or deployment regulation. Narrow state carve-outs in laws otherwise preventing state authority would not prevent the resolution of this question; likewise, measures limited to narrow areas of regulation would not resolve the question.\n* A temporary statutory freeze or moratorium on state AI regulation would count toward the resolution of this question while in force, even if it is not reauthorized later.\n* Instances in which federal funding is conditioned on state compliance with federal authority on regulation would not resolve this question unless the other criteria listed above are satisfied.\n* If there is a reasonable dispute about whether an action meets these criteria, FRI will consult at least three qualified experts in AI governance or regulatory law to reach a resolution by majority vote.\n\n--- p2a ---\nCompute cap on frontier R&D: US alone (P2 (a)).\nCondition: Unilateral decision by US policymakers or a bilateral/multilateral decision made jointly by policymakers in China and the United States to slow the development of frontier AI systems. Part (a): US enacts a policy to slow AI development, with no qualifying measure binding US and China in force\n\nP2. AI Capability Slowdown\n\nSummary: Unilateral decision by US policymakers or a bilateral/multilateral decision made jointly by policymakers in China and the United States to slow the development of frontier AI systems.\n\nPart (a) is assumed: US enacts a policy to slow AI development, with no qualifying measure binding US and China in force (Note that these parts are mutually exclusive.)\n\nBackground:\nCalls to slow frontier AI development have grown prominent over the past few years, though none has produced binding policy. Anthropic in June 2026 [suggested that](https://www.anthropic.com/institute/recursive-self-improvement) creating options to slow or temporarily pause AI development via verifiable mechanisms would be good for the world. A July 2026 [open letter](https://www.pacingthefrontier.com/) from over 1,300 employees of frontier AI companies called for \u201cthe U.S. government [to] support an international effort to develop the technical and governance tools needed to deliberately pace the frontier of automated AI development.\u201d\n\nHistorical baseline:\nAs of August 2026, no binding domestic or international measure constrains how frontier AI developers allocate compute between capability research and safety work.\n\nResolution criteria:\n* This question will resolve positively when the first documented, binding measure takes effect after August 26, 2026 which satisfies the following criteria, as well as the below bullets covering part (a) and (b) of this question separately:\n  * The instrument in question must be a treaty, statute, regulation or other legally binding government measure. Voluntary developer or industry commitments, and non-binding governmental declarations do not count even if widely adopted.\n  * The instrument must bind all frontier AI developers in the relevant jurisdiction(s), rather than a specific named party or set of named parties. Thresholds based on compute, capability, or revenue are acceptable.\n  * The instrument must cap the share of a developer\u2019s total compute allocated to frontier AI research & development activities (including training frontier models and large research experiments) at a level materially below prevailing practice. The policy may require developers to redirect remaining compute to AI safety-oriented activities.\n    * For reference, this policy is partially modeled on [this proposal](https://ai-2040.com/#wishlist-limit-ai-randd-budgets), which suggests a cap on  AI R&D at 25% of compute against an assumed current share of 50%; To resolve this question, a measure does not need to match this figure but should be comparable in stringency.* Assume the measure meaningfully constrains developers.\n  * Compliance must be verified through compute accounting and reporting that is not solely self-attested by the constrained developers.\n* Part (a) resolves positively if a qualifying measure binds the United States and no qualifying measure binds both the United States and China. Part (b) resolves positively if a qualifying measure binds both the United States and China, whether bilaterally or through a multilateral single instrument. Both parts are assessed as of the resolution date, and at most one can resolve positively.\n* If there is a reasonable dispute about whether an action meets these criteria, FRI will consult at least three qualified experts in AI governance or regulatory law to reach a resolution by majority vote.\n\n--- p2b ---\nCompute cap on frontier R&D: US + China (P2 (b)).\nCondition: Unilateral decision by US policymakers or a bilateral/multilateral decision made jointly by policymakers in China and the United States to slow the development of frontier AI systems. Part (b): US and China agree to a single bilateral or multilateral measure to slow AI development\n\nP2. AI Capability Slowdown\n\nSummary: Unilateral decision by US policymakers or a bilateral/multilateral decision made jointly by policymakers in China and the United States to slow the development of frontier AI systems.\n\nPart (b) is assumed: US and China agree to a single bilateral or multilateral measure to slow AI development (Note that these parts are mutually exclusive.)\n\nBackground:\nCalls to slow frontier AI development have grown prominent over the past few years, though none has produced binding policy. Anthropic in June 2026 [suggested that](https://www.anthropic.com/institute/recursive-self-improvement) creating options to slow or temporarily pause AI development via verifiable mechanisms would be good for the world. A July 2026 [open letter](https://www.pacingthefrontier.com/) from over 1,300 employees of frontier AI companies called for \u201cthe U.S. government [to] support an international effort to develop the technical and governance tools needed to deliberately pace the frontier of automated AI development.\u201d\n\nHistorical baseline:\nAs of August 2026, no binding domestic or international measure constrains how frontier AI developers allocate compute between capability research and safety work.\n\nResolution criteria:\n* This question will resolve positively when the first documented, binding measure takes effect after August 26, 2026 which satisfies the following criteria, as well as the below bullets covering part (a) and (b) of this question separately:\n  * The instrument in question must be a treaty, statute, regulation or other legally binding government measure. Voluntary developer or industry commitments, and non-binding governmental declarations do not count even if widely adopted.\n  * The instrument must bind all frontier AI developers in the relevant jurisdiction(s), rather than a specific named party or set of named parties. Thresholds based on compute, capability, or revenue are acceptable.\n  * The instrument must cap the share of a developer\u2019s total compute allocated to frontier AI research & development activities (including training frontier models and large research experiments) at a level materially below prevailing practice. The policy may require developers to redirect remaining compute to AI safety-oriented activities.\n    * For reference, this policy is partially modeled on [this proposal](https://ai-2040.com/#wishlist-limit-ai-randd-budgets), which suggests a cap on  AI R&D at 25% of compute against an assumed current share of 50%; To resolve this question, a measure does not need to match this figure but should be comparable in stringency.* Assume the measure meaningfully constrains developers.\n  * Compliance must be verified through compute accounting and reporting that is not solely self-attested by the constrained developers.\n* Part (a) resolves positively if a qualifying measure binds the United States and no qualifying measure binds both the United States and China. Part (b) resolves positively if a qualifying measure binds both the United States and China, whether bilaterally or through a multilateral single instrument. Both parts are assessed as of the resolution date, and at most one can resolve positively.\n* If there is a reasonable dispute about whether an action meets these criteria, FRI will consult at least three qualified experts in AI governance or regulatory law to reach a resolution by majority vote.\n\n--- p3a ---\nPre-release authorization: US federal body (P3 (a)).\nCondition: A binding requirement that frontier models be vetted and authorized before release, imposed by a US federal body or by an international body. Part (a): A US federal body holds pre-release authorization power\n\nP3. Pre-Release Authorization for Frontier Models\n\nSummary: A binding requirement that frontier models be vetted and authorized before release, imposed by a US federal body or by an international body.\n\nPart (a) is assumed: A US federal body holds pre-release authorization power\n\nBackground:\nA federal pre-deployment licensing gate for frontier AI has been pursued through several channels but has not been enacted. In Congress, Senators Blumenthal and Hawley's 2023 [Bipartisan Framework for a U.S. AI Act](https://www.blumenthal.senate.gov/newsroom/press/release/blumenthal-and-hawley-announce-bipartisan-framework-on-artificial-intelligence-legislation) called for a licensing regime administered by an independent oversight body with authority to audit applicants, but was never introduced as a bill. In September 2025, the same senators introduced the [Artificial Intelligence Risk Evaluation Act](https://www.congress.gov/bill/119th-congress/senate-bill/2938/text), which would require developers to submit advanced AI systems to the Department of Energy before deployment, mandatory disclosure rather than a licensing decision, but it has not passed. In June 2026, the White House's [Executive Order 14409](https://www.whitehouse.gov/presidential-actions/2026/06/promoting-advanced-artificial-intelligence-innovation-and-security/) created a voluntary pre-release review framework for \"covered frontier models\" while explicitly disclaiming any \"mandatory governmental licensing, preclearance, or permitting requirement.\" That same month, the Commerce Department [required a license](https://fortune.com/2026/06/16/trump-administration-licensing-regime-for-frontier-ai-models-ad-hoc-and-opaque-eye-on-ai/) for the export or transfer of two Anthropic frontier models on national-security grounds, functioning as a de facto deployment gate through export-control authority rather than an AI-specific licensing statute.\n\nInternationally, proposals have centered on inspection and verification rather than authorization. In May 2023, OpenAI leaders [argued](https://openai.com/index/governance-of-superintelligence/) that efforts above a capability or compute threshold should be subject to an international authority able to inspect systems, require audits, test for compliance with safety standards, and place restrictions on degrees of deployment; UN Secretary-General Ant\u00f3nio Guterres subsequently [backed](https://www.reuters.com/technology/un-chief-backs-idea-global-ai-watchdog-like-nuclear-agency-2023-06-12/) an International Atomic Energy Agency-style body.\n\nHistorical baseline:\nAs of August 2026, no enacted federal statute, regulation, or executive order requires a license, approval, or other affirmative government authorization before a frontier model may be deployed in the United States. A voluntary pre-release review framework (EO 14409) is in operation and expressly disclaims mandatory licensing, and export-control action has restricted deployment of individual models on a case-by-case basis, but neither establishes pre-deployment licensing as operative law. The only enacted US laws directed at frontier model safety are state transparency and incident-reporting regimes, which impose no approval requirement.\n\nNo international body holds authorization power over frontier model release; existing multilateral AI bodies are advisory.\n\nResolution criteria:\n* This question resolves positively at the first documented instance after August 26, 2026 in which a documented, binding measure requires developers of frontier models, as a class, to obtain affirmative authorization from a US federal or intergovernmental body before any such model may be released, deployed, or otherwise made externally available, and that requirement has taken effect. It must satisfy the following criteria, as well as the below bullets covering part (a) and (b) of this question separately:\n  * Enactment alone does not resolve the question. The administering body must also be open to receive license applications, evidenced by a published rule or notice stating that the body is accepting them. It need not have decided any application yet.\n  * A regime resolves the question if the authorization requirement is legally binding and the body holds the power to deny, condition, or revoke. Assume the requirement is implemented in a form that could meaningfully constrain developers: authorization is genuinely contingent on the body's assessment, and the body has the technical capacity to evaluate the models it reviews.\n  * A requirement to notify, register, or submit information to a federal or intergovernmental body before deployment does not resolve the question where the body makes no decision on whether deployment may proceed. A regime under which deployment is permitted after review unless the body objects and can thereby prevent deployment does resolve the question.\n  * The authorizing body must hold power to require evaluation of the model itself as a condition of authorization, including model access, testing, or independent third-party evaluation, rather than only reviewing documentation the developer chooses to submit. The body need not exercise this power in every case.\n  * A voluntary framework does not resolve the question, however many developers participate. A framework is not voluntary for these purposes if non-participation is legally prohibited or penalized; ineligibility for government contracts, funding, or access programs does not amount to a penalty.\n  * Restrictions on the export, re-export, or transfer of models to foreign persons or jurisdictions do not resolve the question, however framed. The authorization requirement must govern deployment within the jurisdiction(s) in question.\n  * A licensing regime with a sunset provision, or one later repealed or allowed to lapse, would count toward the resolution of this question while in force, even if it is not reauthorized later.\n* Part (a) resolves positively if a US federal body holds qualifying authorization power.\n* Part (b) resolves positively if the authorizing body is established by treaty, multilateral convention, or UN Security Council or General Assembly resolution, and its authorization decisions legally bind developers in member jurisdictions \u2014 whether enforced directly or through mandatory domestic implementation. Member jurisdictions must include the United States and China. Regional bodies whose membership does not include the United States or China (e.g., the European Union) do not qualify, however binding their authorization decisions are on developers operating in their territory. An advisory or standard-setting body whose determinations member states may disregard does not qualify.\n* If there is a reasonable dispute about whether an action meets these criteria, FRI will consult at least three qualified experts in AI governance or regulatory law to reach a resolution by majority vote.\n\n--- p3b ---\nPre-release authorization: international body incl. US + China (P3 (b)).\nCondition: A binding requirement that frontier models be vetted and authorized before release, imposed by a US federal body or by an international body. Part (b): An international body whose member jurisdictions include the United States and China holds pre-release authorization power over frontier models\n\nP3. Pre-Release Authorization for Frontier Models\n\nSummary: A binding requirement that frontier models be vetted and authorized before release, imposed by a US federal body or by an international body.\n\nPart (b) is assumed: An international body whose member jurisdictions include the United States and China holds pre-release authorization power over frontier models\n\nBackground:\nA federal pre-deployment licensing gate for frontier AI has been pursued through several channels but has not been enacted. In Congress, Senators Blumenthal and Hawley's 2023 [Bipartisan Framework for a U.S. AI Act](https://www.blumenthal.senate.gov/newsroom/press/release/blumenthal-and-hawley-announce-bipartisan-framework-on-artificial-intelligence-legislation) called for a licensing regime administered by an independent oversight body with authority to audit applicants, but was never introduced as a bill. In September 2025, the same senators introduced the [Artificial Intelligence Risk Evaluation Act](https://www.congress.gov/bill/119th-congress/senate-bill/2938/text), which would require developers to submit advanced AI systems to the Department of Energy before deployment, mandatory disclosure rather than a licensing decision, but it has not passed. In June 2026, the White House's [Executive Order 14409](https://www.whitehouse.gov/presidential-actions/2026/06/promoting-advanced-artificial-intelligence-innovation-and-security/) created a voluntary pre-release review framework for \"covered frontier models\" while explicitly disclaiming any \"mandatory governmental licensing, preclearance, or permitting requirement.\" That same month, the Commerce Department [required a license](https://fortune.com/2026/06/16/trump-administration-licensing-regime-for-frontier-ai-models-ad-hoc-and-opaque-eye-on-ai/) for the export or transfer of two Anthropic frontier models on national-security grounds, functioning as a de facto deployment gate through export-control authority rather than an AI-specific licensing statute.\n\nInternationally, proposals have centered on inspection and verification rather than authorization. In May 2023, OpenAI leaders [argued](https://openai.com/index/governance-of-superintelligence/) that efforts above a capability or compute threshold should be subject to an international authority able to inspect systems, require audits, test for compliance with safety standards, and place restrictions on degrees of deployment; UN Secretary-General Ant\u00f3nio Guterres subsequently [backed](https://www.reuters.com/technology/un-chief-backs-idea-global-ai-watchdog-like-nuclear-agency-2023-06-12/) an International Atomic Energy Agency-style body.\n\nHistorical baseline:\nAs of August 2026, no enacted federal statute, regulation, or executive order requires a license, approval, or other affirmative government authorization before a frontier model may be deployed in the United States. A voluntary pre-release review framework (EO 14409) is in operation and expressly disclaims mandatory licensing, and export-control action has restricted deployment of individual models on a case-by-case basis, but neither establishes pre-deployment licensing as operative law. The only enacted US laws directed at frontier model safety are state transparency and incident-reporting regimes, which impose no approval requirement.\n\nNo international body holds authorization power over frontier model release; existing multilateral AI bodies are advisory.\n\nResolution criteria:\n* This question resolves positively at the first documented instance after August 26, 2026 in which a documented, binding measure requires developers of frontier models, as a class, to obtain affirmative authorization from a US federal or intergovernmental body before any such model may be released, deployed, or otherwise made externally available, and that requirement has taken effect. It must satisfy the following criteria, as well as the below bullets covering part (a) and (b) of this question separately:\n  * Enactment alone does not resolve the question. The administering body must also be open to receive license applications, evidenced by a published rule or notice stating that the body is accepting them. It need not have decided any application yet.\n  * A regime resolves the question if the authorization requirement is legally binding and the body holds the power to deny, condition, or revoke. Assume the requirement is implemented in a form that could meaningfully constrain developers: authorization is genuinely contingent on the body's assessment, and the body has the technical capacity to evaluate the models it reviews.\n  * A requirement to notify, register, or submit information to a federal or intergovernmental body before deployment does not resolve the question where the body makes no decision on whether deployment may proceed. A regime under which deployment is permitted after review unless the body objects and can thereby prevent deployment does resolve the question.\n  * The authorizing body must hold power to require evaluation of the model itself as a condition of authorization, including model access, testing, or independent third-party evaluation, rather than only reviewing documentation the developer chooses to submit. The body need not exercise this power in every case.\n  * A voluntary framework does not resolve the question, however many developers participate. A framework is not voluntary for these purposes if non-participation is legally prohibited or penalized; ineligibility for government contracts, funding, or access programs does not amount to a penalty.\n  * Restrictions on the export, re-export, or transfer of models to foreign persons or jurisdictions do not resolve the question, however framed. The authorization requirement must govern deployment within the jurisdiction(s) in question.\n  * A licensing regime with a sunset provision, or one later repealed or allowed to lapse, would count toward the resolution of this question while in force, even if it is not reauthorized later.\n* Part (a) resolves positively if a US federal body holds qualifying authorization power.\n* Part (b) resolves positively if the authorizing body is established by treaty, multilateral convention, or UN Security Council or General Assembly resolution, and its authorization decisions legally bind developers in member jurisdictions \u2014 whether enforced directly or through mandatory domestic implementation. Member jurisdictions must include the United States and China. Regional bodies whose membership does not include the United States or China (e.g., the European Union) do not qualify, however binding their authorization decisions are on developers operating in their territory. An advisory or standard-setting body whose determinations member states may disregard does not qualify.\n* If there is a reasonable dispute about whether an action meets these criteria, FRI will consult at least three qualified experts in AI governance or regulatory law to reach a resolution by majority vote.\n\n--- p4 ---\nFederal strict liability, scaled insurance, punitive damages (P4).\nCondition: A US federal statute treating frontier model training and deployment as an abnormally dangerous activity subject to strict liability (i.e., a regime under which a developer is liable for harms its models cause without the injured party having to prove the developer was careless or the model defective). The statute permits damages reflecting the expected magnitude of unrealized harm the conduct made more likely and requires developers to be insured for their liability.\n\nP4. Strict Liability\n\nSummary: A US federal statute treating frontier model training and deployment as an abnormally dangerous activity subject to strict liability (i.e., a regime under which a developer is liable for harms its models cause without the injured party having to prove the developer was careless or the model defective). The statute permits damages reflecting the expected magnitude of unrealized harm the conduct made more likely and requires developers to be insured for their liability.\n\nBackground:\n[Strict liability](https://en.wikipedia.org/wiki/Strict_liability) is an exception to the ordinary rule that a plaintiff must prove the defendant was at fault. For a narrow set of activities courts classify as \"abnormally dangerous\" (e.g., storing hazardous chemicals, keeping wild animals), a plaintiff need only show the activity caused the harm, and reasonable care is no defense. Congress has enacted comparable regimes by statute for hazardous industries, including [CERCLA](https://en.wikipedia.org/wiki/Superfund), the [Oil Pollution Act of 1990](https://en.wikipedia.org/wiki/Oil_Pollution_Act_of_1990), and the [Price-Anderson Act](https://en.wikipedia.org/wiki/Price%E2%80%93Anderson_Nuclear_Industries_Indemnity_Act), which pair strict liability with mandatory financial responsibility scaled to the risk. No US jurisdiction has extended this category to AI; existing AI litigation proceeds on products liability and negligence theories, which retain a defect or fault element. A [leading articulation](https://www.lesswrong.com/posts/5e7TrmH7mBwqpZ6ek/tort-law-can-play-an-important-role-in-mitigating-ai-risk) of this policy is Gabriel Weil's, which pairs strict liability with insurance requirements that scale with dangerous model capabilities and punitive damages addressing uninsurable risks.\n\nHistorical baseline:\nAs of August 2026, no US jurisdiction has classified frontier AI training or deployment as an abnormally dangerous activity by statute or controlling judicial holding, no US law requires AI developers to carry liability insurance, and no US jurisdiction authorizes punitive damages against AI developers absent a showing of malice or recklessness.\n\nResolution criteria:\n* This question resolves positively at the first documented instance after August 26, 2026 in which all three of the following are simultaneously operative federally across the United States and applicable to all frontier developers:\n  * strict liability for harms caused by frontier AI models\n  * a liability insurance requirement scaled to assessed model capabilities\n  * punitive damages available without proof of malice or recklessness in cases where realized harm is correlated with a larger unrealized catastrophic outcome.\n* Only federal law resolves this question. A qualifying instrument is a federal statute in force, or a regulation promulgated under a federal statute that authorizes it.\n  * State statutes, state common law developments, and state regulatory action do not count toward any element, whether individually or in combination. Federal court decisions applying state tort law do not count, including a federal court's characterization of frontier AI training or deployment as an abnormally dangerous activity where that characterization rests on state law.\n* The strict liability element requires that a plaintiff be able to recover for harms caused by a frontier model without proving negligence, defect, or unreasonable design. Physical harm to persons or property must be within the scope of recoverable harm; a regime that also reaches economic loss, or that reaches economic loss in addition to physical harm, still counts. A regime confined to economic loss, privacy, discrimination, or reputational harm does not count.\n  * A regime in which the developer may escape liability by demonstrating compliance with a standard of care, an approved safety framework, or industry best practice does not count.\n  * A federal products liability standard that requires a design defect or failure to warn does not count.\n* The insurance element requires that federal law condition training or deployment on demonstrating liability insurance, self-insurance, surety, or equivalent financial assurance, in an amount that varies as a function of model capability, training compute, or evaluation results. A flat, uniform, or de minimis requirement does not count, nor does a requirement scaled solely to developer revenue, valuation, or headcount. Voluntary coverage, insurer underwriting practices, and industry commitments do not count.\n* The punitive damages element requires both of the following.\n  * Punitive damages must be available even in the absence of malice, fraud, oppression, or reckless disregard.\n  * The regime must permit awards to reflect the expected magnitude of harm the conduct made more likely, including catastrophic harm that did not in fact occur.\n* A regime whose covered model definition, exemptions, or carve-outs exclude one or more of the largest US frontier developers by training compute does not resolve this question.\n* If there is a reasonable dispute about whether an action meets these criteria, FRI will consult at least three qualified experts in tort law or AI governance to reach a resolution by majority vote.\n\n--- p5 ---\nBundle: P2b + P3b + P4 (P5).\nCondition: Assume all three policies are in force: a binding US\u2013China measure slowing frontier AI development, an international body (with member jurisdictions including the US and China) holding pre-release authorization power over frontier models, and federal strict liability for frontier AI harms.\n\nP2. AI Capability Slowdown\n\nSummary: Unilateral decision by US policymakers or a bilateral/multilateral decision made jointly by policymakers in China and the United States to slow the development of frontier AI systems.\n\nPart (b) is assumed: US and China agree to a single bilateral or multilateral measure to slow AI development (Note that these parts are mutually exclusive.)\n\nBackground:\nCalls to slow frontier AI development have grown prominent over the past few years, though none has produced binding policy. Anthropic in June 2026 [suggested that](https://www.anthropic.com/institute/recursive-self-improvement) creating options to slow or temporarily pause AI development via verifiable mechanisms would be good for the world. A July 2026 [open letter](https://www.pacingthefrontier.com/) from over 1,300 employees of frontier AI companies called for \u201cthe U.S. government [to] support an international effort to develop the technical and governance tools needed to deliberately pace the frontier of automated AI development.\u201d\n\nHistorical baseline:\nAs of August 2026, no binding domestic or international measure constrains how frontier AI developers allocate compute between capability research and safety work.\n\nResolution criteria:\n* This question will resolve positively when the first documented, binding measure takes effect after August 26, 2026 which satisfies the following criteria, as well as the below bullets covering part (a) and (b) of this question separately:\n  * The instrument in question must be a treaty, statute, regulation or other legally binding government measure. Voluntary developer or industry commitments, and non-binding governmental declarations do not count even if widely adopted.\n  * The instrument must bind all frontier AI developers in the relevant jurisdiction(s), rather than a specific named party or set of named parties. Thresholds based on compute, capability, or revenue are acceptable.\n  * The instrument must cap the share of a developer\u2019s total compute allocated to frontier AI research & development activities (including training frontier models and large research experiments) at a level materially below prevailing practice. The policy may require developers to redirect remaining compute to AI safety-oriented activities.\n    * For reference, this policy is partially modeled on [this proposal](https://ai-2040.com/#wishlist-limit-ai-randd-budgets), which suggests a cap on  AI R&D at 25% of compute against an assumed current share of 50%; To resolve this question, a measure does not need to match this figure but should be comparable in stringency.* Assume the measure meaningfully constrains developers.\n  * Compliance must be verified through compute accounting and reporting that is not solely self-attested by the constrained developers.\n* Part (a) resolves positively if a qualifying measure binds the United States and no qualifying measure binds both the United States and China. Part (b) resolves positively if a qualifying measure binds both the United States and China, whether bilaterally or through a multilateral single instrument. Both parts are assessed as of the resolution date, and at most one can resolve positively.\n* If there is a reasonable dispute about whether an action meets these criteria, FRI will consult at least three qualified experts in AI governance or regulatory law to reach a resolution by majority vote.\n\n---\n\nP3. Pre-Release Authorization for Frontier Models\n\nSummary: A binding requirement that frontier models be vetted and authorized before release, imposed by a US federal body or by an international body.\n\nPart (b) is assumed: An international body whose member jurisdictions include the United States and China holds pre-release authorization power over frontier models\n\nBackground:\nA federal pre-deployment licensing gate for frontier AI has been pursued through several channels but has not been enacted. In Congress, Senators Blumenthal and Hawley's 2023 [Bipartisan Framework for a U.S. AI Act](https://www.blumenthal.senate.gov/newsroom/press/release/blumenthal-and-hawley-announce-bipartisan-framework-on-artificial-intelligence-legislation) called for a licensing regime administered by an independent oversight body with authority to audit applicants, but was never introduced as a bill. In September 2025, the same senators introduced the [Artificial Intelligence Risk Evaluation Act](https://www.congress.gov/bill/119th-congress/senate-bill/2938/text), which would require developers to submit advanced AI systems to the Department of Energy before deployment, mandatory disclosure rather than a licensing decision, but it has not passed. In June 2026, the White House's [Executive Order 14409](https://www.whitehouse.gov/presidential-actions/2026/06/promoting-advanced-artificial-intelligence-innovation-and-security/) created a voluntary pre-release review framework for \"covered frontier models\" while explicitly disclaiming any \"mandatory governmental licensing, preclearance, or permitting requirement.\" That same month, the Commerce Department [required a license](https://fortune.com/2026/06/16/trump-administration-licensing-regime-for-frontier-ai-models-ad-hoc-and-opaque-eye-on-ai/) for the export or transfer of two Anthropic frontier models on national-security grounds, functioning as a de facto deployment gate through export-control authority rather than an AI-specific licensing statute.\n\nInternationally, proposals have centered on inspection and verification rather than authorization. In May 2023, OpenAI leaders [argued](https://openai.com/index/governance-of-superintelligence/) that efforts above a capability or compute threshold should be subject to an international authority able to inspect systems, require audits, test for compliance with safety standards, and place restrictions on degrees of deployment; UN Secretary-General Ant\u00f3nio Guterres subsequently [backed](https://www.reuters.com/technology/un-chief-backs-idea-global-ai-watchdog-like-nuclear-agency-2023-06-12/) an International Atomic Energy Agency-style body.\n\nHistorical baseline:\nAs of August 2026, no enacted federal statute, regulation, or executive order requires a license, approval, or other affirmative government authorization before a frontier model may be deployed in the United States. A voluntary pre-release review framework (EO 14409) is in operation and expressly disclaims mandatory licensing, and export-control action has restricted deployment of individual models on a case-by-case basis, but neither establishes pre-deployment licensing as operative law. The only enacted US laws directed at frontier model safety are state transparency and incident-reporting regimes, which impose no approval requirement.\n\nNo international body holds authorization power over frontier model release; existing multilateral AI bodies are advisory.\n\nResolution criteria:\n* This question resolves positively at the first documented instance after August 26, 2026 in which a documented, binding measure requires developers of frontier models, as a class, to obtain affirmative authorization from a US federal or intergovernmental body before any such model may be released, deployed, or otherwise made externally available, and that requirement has taken effect. It must satisfy the following criteria, as well as the below bullets covering part (a) and (b) of this question separately:\n  * Enactment alone does not resolve the question. The administering body must also be open to receive license applications, evidenced by a published rule or notice stating that the body is accepting them. It need not have decided any application yet.\n  * A regime resolves the question if the authorization requirement is legally binding and the body holds the power to deny, condition, or revoke. Assume the requirement is implemented in a form that could meaningfully constrain developers: authorization is genuinely contingent on the body's assessment, and the body has the technical capacity to evaluate the models it reviews.\n  * A requirement to notify, register, or submit information to a federal or intergovernmental body before deployment does not resolve the question where the body makes no decision on whether deployment may proceed. A regime under which deployment is permitted after review unless the body objects and can thereby prevent deployment does resolve the question.\n  * The authorizing body must hold power to require evaluation of the model itself as a condition of authorization, including model access, testing, or independent third-party evaluation, rather than only reviewing documentation the developer chooses to submit. The body need not exercise this power in every case.\n  * A voluntary framework does not resolve the question, however many developers participate. A framework is not voluntary for
