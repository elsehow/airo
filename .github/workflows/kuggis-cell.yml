# Managed by kuggis's development-cell contract. Changes are reviewed in a PR.
name: cell-tests
on:
  pull_request:
  push:
    branches: ["main"]
permissions:
  contents: read
jobs:
  cell-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - name: Offline tests
        run: "(cd packages/fri-forecaster && npm ci) && python -m pip install -e '.[test]' -e './packages/fri-forecaster[dev]' && python -m pytest -q"
